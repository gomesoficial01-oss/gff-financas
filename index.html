<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFF — Gestão Financeira Familiar</title>
<meta name="theme-color" content="#0F6B5C"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="styles.css"></head><body>

<section id="t-login" class="tela" hidden><form class="cx" id="f-login">
<h1>GFF</h1><p class="mut">Gestão Financeira Familiar</p>
<label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="username" required>
<label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password" required>
<button class="pri" type="submit">Entrar</button>
<button class="lnk" type="button" id="b-esqueci">Esqueci a senha</button>
<div class="msg" id="m-login" role="alert"></div></form></section>

<section id="t-esqueci" class="tela" hidden><form class="cx" id="f-esqueci">
<h1>Recuperar senha</h1><p class="mut">Enviaremos um link para o seu e-mail.</p>
<label for="e-email">E-mail</label><input id="e-email" type="email" required>
<button class="pri" type="submit">Enviar link</button>
<button class="lnk" type="button" id="b-voltar">Voltar ao login</button>
<div class="msg" id="m-esqueci" role="alert"></div></form></section>

<section id="t-nova" class="tela" hidden><form class="cx" id="f-nova">
<h1>Definir nova senha</h1>
<label for="n-senha">Nova senha (mín. 8 caracteres)</label><input id="n-senha" type="password" autocomplete="new-password" minlength="8" required>
<label for="n-senha2">Repita a nova senha</label><input id="n-senha2" type="password" autocomplete="new-password" minlength="8" required>
<button class="pri" type="submit">Salvar senha</button>
<div class="msg" id="m-nova" role="alert"></div></form></section>

<section id="t-sem" class="tela" hidden><div class="cx"><h1>Sem família vinculada</h1>
<p class="mut">Sua conta existe, mas ainda não está vinculada a uma família. Peça ao proprietário para vincular.</p>
<button class="pri sair" type="button">Sair</button></div></section>

<section id="t-app" hidden>
<header class="top"><div><b id="h-fam">Família</b><small id="h-papel"></small></div>
<div><button type="button" id="b-alterar">Alterar senha</button> <button type="button" class="sair">Sair</button></div></header>
<nav aria-label="Módulos"><button type="button" data-mod="contas" aria-current="true">Contas</button></nav>
<main id="mod-contas">
<p class="mut">Saldo total</p><p class="total" id="total">R$ 0,00</p>
<h2>Contas</h2><div id="lista"></div>
<form id="f-conta" class="cx" style="max-width:none;margin-top:16px"><h2>Nova conta</h2>
<label for="c-nome">Nome</label><input id="c-nome" required maxlength="60" placeholder="Ex.: Nubank, Carteira">
<div class="linha"><div><label for="c-tipo">Tipo</label><select id="c-tipo"><option value="checking">Conta corrente</option><option value="savings">Poupança</option><option value="cash">Carteira</option><option value="digital">Conta digital</option><option value="investment">Investimento</option><option value="other">Outra</option></select></div>
<div><label for="c-saldo">Saldo inicial (R$)</label><input id="c-saldo" type="number" step="0.01" value="0" required></div></div>
<button class="pri" type="submit">Adicionar conta</button><div class="msg" id="m-conta" role="alert"></div></form>
</main></section>

<dialog id="d-senha"><form id="f-alt"><h2>Alterar senha</h2>
<label for="a-senha">Nova senha (mín. 8 caracteres)</label><input id="a-senha" type="password" autocomplete="new-password" minlength="8" required>
<label for="a-senha2">Repita a nova senha</label><input id="a-senha2" type="password" autocomplete="new-password" minlength="8" required>
<button class="pri" type="submit">Salvar senha</button>
<button class="lnk" type="button" id="a-cancel">Cancelar</button>
<div class="msg" id="m-alt" role="alert"></div></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase.js"></script><script src="auth.js"></script><script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))</script>
</body></html>
